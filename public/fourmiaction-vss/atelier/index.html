*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:'Inter',system-ui,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;font-feature-settings:"cv11","ss01"}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
h1,h2,h3{font-family:'Inter Display','Inter',sans-serif;letter-spacing:-.015em;margin:0}
@keyframes pop{from{opacity:0;transform:scale(.9) translateY(10px)}}
@keyframes fadeup{from{opacity:0;transform:translateY(16px)}}
@keyframes grow{from{transform:scaleX(0)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
body.proj{background:#0E2236;overflow:hidden}
.viewport{position:fixed;inset:0;overflow:hidden}
.stage{width:1600px;height:900px;position:absolute;left:50%;top:50%;background:#F6F8FA;transform-origin:center;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.35)}
/* barre haute */
.sbar{position:absolute;left:0;right:0;top:0;height:76px;display:flex;align-items:center;gap:22px;padding:0 44px;z-index:5}
.sbar .lg{width:150px;height:26px;background:var(--logo) no-repeat left center/contain}
.sbar .kick{font-size:17px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--orange)}
.sbar .sp{flex:1}
.join-chip{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:6px 16px 6px 6px;font-size:17px;color:var(--muted)}
.join-chip .q{width:56px;height:56px}
.join-chip .q svg{width:100%;height:100%;display:block}
.join-chip b{font-size:24px;color:var(--blue);letter-spacing:.12em;font-weight:700}
.join-chip .n{font-weight:600;color:var(--green)}
.timer{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:40px;padding:6px 8px 6px 20px}
.timer .t{font-size:30px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--blue);min-width:92px}
.timer.run .t{color:var(--orange)}
.timer.over{animation:tpulse 1.2s ease-in-out infinite}
.timer.over .t{color:#B3261E}
@keyframes tpulse{50%{box-shadow:0 0 0 8px rgba(211,90,11,.2)}}
.ib{all:unset;cursor:pointer;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--blue)}
.ib:hover{background:var(--lblue)}
.ib svg{width:24px;height:24px}
.ib:focus-visible{outline:3px solid var(--orange)}
/* contenu */
.slide{position:absolute;left:0;right:0;top:76px;bottom:70px;padding:18px 64px 0;display:flex;flex-direction:column}
.slide.in .anim{animation:fadeup .7s cubic-bezier(.2,.8,.2,1) both}
.slide.in .anim:nth-child(2){animation-delay:.08s}.slide.in .anim:nth-child(3){animation-delay:.16s}
.slide h1{font-size:64px;line-height:1.05;color:var(--blue);font-weight:600}
.slide .cons{font-size:27px;line-height:1.4;color:var(--ink);margin:14px 0 0;max-width:1300px}
.slide .cons b{color:var(--orange);font-weight:600}
.live{flex:1;min-height:0;margin-top:26px;position:relative}
.ctrl{position:absolute;right:64px;top:22px;display:flex;gap:10px}
.cbtn{all:unset;cursor:pointer;font-size:17px;font-weight:600;padding:10px 18px;border-radius:12px;background:#fff;border:1.5px solid var(--line);color:var(--blue);transition:background .2s}
.cbtn:hover{background:var(--lblue)}
.cbtn.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.cbtn:focus-visible{outline:3px solid var(--orange)}
/* pied */
.sfoot{position:absolute;left:0;right:0;bottom:0;height:70px;display:flex;align-items:center;gap:18px;padding:0 44px}
.dots{display:flex;gap:7px;flex:1;align-items:center}
.dots button{all:unset;cursor:pointer;height:8px;flex:1;max-width:70px;border-radius:8px;background:var(--line);transition:background .3s}
.dots button.done{background:#9DBAD3}
.dots button.cur{background:var(--orange)}
.nav{all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;font-size:19px;font-weight:600;padding:12px 22px;border-radius:14px;background:var(--blue);color:#fff}
.nav.prev{background:#fff;color:var(--blue);border:1.5px solid var(--line)}
.nav:focus-visible{outline:3px solid var(--orange)}
.nav[hidden]{display:none}
